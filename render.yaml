services:
  - type: web
    name: gourousdja-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: Backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_MAIN_ID
        value: 1
      - key: NODE_ENV
        value: production